    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script>
            // Compact mode is the ONLY supported layout mode.
            // Ensure fresh installs never see "normal" mode.
            (function () {
                try { document.documentElement.classList.add('compact-layout'); } catch (_) {}
            })();
        </script>
        <script>
            (function () {
                try {
                    var choice = localStorage.getItem('uiThemeChoice') || 'dark';
                    var allowed = ['dark', 'light', 'liquidglass', 'midnight', 'sepia', 'nord', 'dracula', 'abyss'];
                    if (allowed.indexOf(choice) === -1) choice = 'dark';
                    var resolved = choice;
                    document.documentElement.dataset.themeChoice = choice;
                    document.documentElement.dataset.theme = resolved;
                } catch (_) {}
            })();
        </script>
        <script type="module" src="components/app/GhostPrepApp.js"></script>

        <ghostprep-app id="cheddar"></ghostprep-app>
        <script>

                if (isElectron) {
                    var s = document.createElement('script');
                    s.src = 'utils/renderer.js';
                    document.head.appendChild(s);
                }
            })();
        </script>
